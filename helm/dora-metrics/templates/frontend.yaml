apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-frontend
  namespace: {{ include "dora.namespace" . }}
  labels:
    {{- include "dora.labels" . | nindent 4 }}
    app: dora-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: dora-frontend }
  template:
    metadata:
      labels: { app: dora-frontend }
    spec:
      serviceAccountName: dora-frontend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: {{ include "dora.frontend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.frontend.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run,   mountPath: /var/run }
            - { name: tmp,         mountPath: /tmp }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
      volumes:
        - { name: nginx-cache, emptyDir: { sizeLimit: 64Mi } }
        - { name: nginx-run,   emptyDir: { sizeLimit: 8Mi } }
        - { name: tmp,         emptyDir: { medium: Memory, sizeLimit: 16Mi } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: dora-frontend }
---
apiVersion: v1
kind: Service
metadata:
  name: dora-frontend
  namespace: {{ include "dora.namespace" . }}
spec:
  type: ClusterIP
  selector: { app: dora-frontend }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dora-frontend
  namespace: {{ include "dora.namespace" . }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: dora-frontend }
