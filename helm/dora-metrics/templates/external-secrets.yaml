{{- if .Values.externalSecrets.enabled }}
{{- /*
Pulls dora-secrets from AWS Secrets Manager via External Secrets
Operator (https://external-secrets.io). Prerequisites:
  1. ESO installed in the cluster.
  2. AWS Secrets Manager secret exists at .Values.externalSecrets.secretArn
     as a JSON map of env keys.
  3. IRSA role bound to ServiceAccount dora-backend with
     secretsmanager:GetSecretValue on that ARN.
*/ -}}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: {{ include "dora.namespace" . }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: dora-backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dora-secrets
  namespace: {{ include "dora.namespace" . }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: dora-secrets
    creationPolicy: Owner
  data:
    - secretKey: DORA_DATABASE_URL
      remoteRef: { key: {{ .Values.externalSecrets.secretArn | quote }}, property: DORA_DATABASE_URL }
    - secretKey: DORA_GITHUB_TOKEN
      remoteRef: { key: {{ .Values.externalSecrets.secretArn | quote }}, property: DORA_GITHUB_TOKEN }
    - secretKey: DORA_GITHUB_WEBHOOK_SECRET
      remoteRef: { key: {{ .Values.externalSecrets.secretArn | quote }}, property: DORA_GITHUB_WEBHOOK_SECRET }
    - secretKey: DORA_API_KEY
      remoteRef: { key: {{ .Values.externalSecrets.secretArn | quote }}, property: DORA_API_KEY }
    - secretKey: DORA_CLAUDE_CODE_ADMIN_KEY
      remoteRef: { key: {{ .Values.externalSecrets.secretArn | quote }}, property: DORA_CLAUDE_CODE_ADMIN_KEY }
{{- end }}
