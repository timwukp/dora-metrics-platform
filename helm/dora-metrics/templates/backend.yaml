apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-backend
  namespace: {{ include "dora.namespace" . }}
  labels:
    {{- include "dora.labels" . | nindent 4 }}
    app: dora-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: dora-backend }
  template:
    metadata:
      labels: { app: dora-backend }
    spec:
      serviceAccountName: dora-backend
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: {{ include "dora.backend.image" . | quote }}
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - secretRef: { name: dora-secrets }
          env:
            {{- range $k, $v := .Values.backend.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.backend.autoMigrate }}
            - { name: DORA_AUTO_MIGRATE, value: "true" }
            {{- end }}
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef: { fieldPath: spec.nodeName }
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 64Mi } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: dora-backend }
---
apiVersion: v1
kind: Service
metadata:
  name: dora-backend
  namespace: {{ include "dora.namespace" . }}
  labels: { app: dora-backend }
spec:
  type: ClusterIP
  selector: { app: dora-backend }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dora-backend
  namespace: {{ include "dora.namespace" . }}
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: dora-backend }
