apiVersion: v2
name: dora-metrics
description: |
  DORA metrics platform — FastAPI backend + frontend with built-in DORA
  metric calculators (deployment frequency, lead time, change failure
  rate, MTTR), Postgres-backed APScheduler ingest, and an alerting
  pipeline. Two presets out of the box:

    * trial mode      — port-forward only, in-cluster Postgres, 1 replica
    * production mode — ALB Ingress + External Secrets Operator + RDS

type: application
version: 0.1.0
appVersion: "1.0.0"
home: https://github.com/timwukp/dora-metrics-platform
sources:
  - https://github.com/timwukp/dora-metrics-platform
maintainers:
  - name: timwukp
kubeVersion: ">=1.27.0-0"
