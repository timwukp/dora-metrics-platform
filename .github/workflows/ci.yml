name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff bandit
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check app
      - name: Security lint (bandit)
        working-directory: backend
        run: bandit -r app -ll
      - name: Import smoke test
        working-directory: backend
        env:
          DORA_DATABASE_URL: postgresql://dora:placeholder@localhost:5432/dora_metrics
          DORA_GITHUB_REPOS: example/repo
          DORA_GITHUB_WEBHOOK_SECRET: x
          DORA_API_KEY: x
        run: python -c "from app.main import app; print('ok')"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Audit
        working-directory: frontend
        run: npm audit --audit-level=high || true
      - name: Build
        working-directory: frontend
        run: npm run build
