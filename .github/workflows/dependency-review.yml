name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - uses: actions/dependency-review-action@v4
        # Requires Dependency Graph + GitHub Advanced Security on private repos.
        # Soft-fail on platforms where it's unavailable so the workflow doesn't
        # block PRs in repos without GHAS.
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
