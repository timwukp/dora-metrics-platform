name: Kubernetes Manifest Scan

on:
  pull_request:
    paths: ["infra/k8s/**"]
  push:
    branches: [main]
    paths: ["infra/k8s/**"]

permissions:
  contents: read
  security-events: write

jobs:
  kubescape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Kubescape scan
        uses: kubescape/github-action@main
        with:
          files: infra/k8s
          frameworks: nsa,mitre,armobest
          format: sarif
          outputFile: kubescape.sarif
          # Exempts C-0237 (image signature) for the dora-metrics namespace
          # only. Image signing belongs in the CD pipeline; the placeholder
          # tags shipped in this repo aren't cosign-signed by design.
          exceptions: infra/k8s/kubescape-exceptions.json
          # Only fail on Critical/High severity misconfigurations.
          # Medium findings are reported but don't break the build.
          failedThreshold: 8
      - uses: github/codeql-action/upload-sarif@v3
        # SARIF upload requires GitHub Advanced Security on private repos.
        if: always()
        continue-on-error: true
        with:
          sarif_file: kubescape.sarif
          category: kubescape
