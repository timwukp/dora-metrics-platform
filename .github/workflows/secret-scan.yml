name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          # GITLEAKS_LICENSE only required for org accounts; ignore for personal repos.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
