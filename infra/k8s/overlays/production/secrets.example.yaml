# EXAMPLE ONLY — DO NOT COMMIT REAL SECRETS.
#
# Production: use AWS Secrets Manager + External Secrets Operator (see
# infra/k8s/external-secrets.yaml). For local kind/minikube testing only,
# you may copy this to secrets.yaml (gitignored) and `kubectl apply -f`.
apiVersion: v1
kind: Secret
metadata:
  name: dora-secrets
  namespace: dora-metrics
type: Opaque
stringData:
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  DORA_DATABASE_URL: "postgresql://dora:REPLACE_WITH_STRONG_PASSWORD@postgres:5432/dora_metrics"
  DORA_GITHUB_TOKEN: "REPLACE_WITH_FINE_GRAINED_PAT"
  DORA_GITHUB_WEBHOOK_SECRET: "REPLACE_WITH_RANDOM_HEX"  # gitleaks:allow
  DORA_API_KEY: "REPLACE_WITH_RANDOM_TOKEN"
  DORA_CLAUDE_CODE_ADMIN_KEY: ""  # optional
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
