# Production overlay patch — adds the IRSA annotation to the dora-backend SA.
# Use scripts/render-manifests.sh to envsubst $AWS_ACCOUNT_ID before apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dora-backend
  namespace: dora-metrics
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/dora-backend-irsa
