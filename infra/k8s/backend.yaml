apiVersion: apps/v1
kind: Deployment
metadata:
  name: dora-backend
  namespace: dora-metrics
  labels: { app: dora-backend }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: dora-backend }
  template:
    metadata:
      labels: { app: dora-backend }
      annotations:
        # Force a rolling restart when the secret changes (set by your CD).
        checksum/secrets: "{{REPLACE_AT_DEPLOY}}"
    spec:
      serviceAccountName: dora-backend
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          # Pin to immutable digest in production; CD pipeline replaces this.
          image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/dora-backend:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - secretRef: { name: dora-secrets }
          env:
            - { name: DORA_GITHUB_REPOS,           value: "REPLACE_WITH_OWNER/REPO" }
            - { name: DORA_POLL_INTERVAL_MINUTES,  value: "15" }
            - { name: DORA_CORS_ORIGINS,           value: "https://dora.example.com" }
            - { name: DORA_LOG_LEVEL,              value: "INFO" }
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          livenessProbe:
            # Liveness only checks the process is up — failing restarts the
            # pod, so we must not couple it to DB reachability.
            httpGet: { path: /api/v1/health/live, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            # Readiness includes a SELECT 1 — failing pulls the pod from the
            # Service so traffic isn't routed to a node with a broken DB.
            httpGet: { path: /api/v1/health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            failureThreshold: 30
            periodSeconds: 2
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 64Mi } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: dora-backend }
---
apiVersion: v1
kind: Service
metadata:
  name: dora-backend
  namespace: dora-metrics
  labels: { app: dora-backend }
spec:
  type: ClusterIP
  selector: { app: dora-backend }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dora-backend
  namespace: dora-metrics
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: dora-backend }
