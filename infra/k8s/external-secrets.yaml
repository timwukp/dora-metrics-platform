# Production secret loading — pulls values from AWS Secrets Manager via the
# External Secrets Operator (https://external-secrets.io). Prerequisites:
#   1. Install ESO: helm install external-secrets external-secrets/external-secrets -n external-secrets --create-namespace
#   2. Create the source secret in Secrets Manager (JSON map of env keys)
#   3. Bind an IRSA role to ServiceAccount `dora-backend` granting
#      secretsmanager:GetSecretValue on that ARN.
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: dora-metrics
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1     # CHANGE to your region
      auth:
        jwt:
          serviceAccountRef:
            name: dora-backend
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dora-secrets
  namespace: dora-metrics
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: dora-secrets
    creationPolicy: Owner
  data:
    - secretKey: DORA_DATABASE_URL
      remoteRef: { key: dora-metrics/prod, property: DORA_DATABASE_URL }
    - secretKey: DORA_GITHUB_TOKEN
      remoteRef: { key: dora-metrics/prod, property: DORA_GITHUB_TOKEN }
    - secretKey: DORA_GITHUB_WEBHOOK_SECRET
      remoteRef: { key: dora-metrics/prod, property: DORA_GITHUB_WEBHOOK_SECRET }
    - secretKey: DORA_API_KEY
      remoteRef: { key: dora-metrics/prod, property: DORA_API_KEY }
    - secretKey: DORA_CLAUDE_CODE_ADMIN_KEY
      remoteRef: { key: dora-metrics/prod, property: DORA_CLAUDE_CODE_ADMIN_KEY }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: dora-metrics/prod, property: POSTGRES_PASSWORD }
