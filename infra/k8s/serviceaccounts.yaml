apiVersion: v1
kind: ServiceAccount
metadata:
  name: dora-backend
  namespace: dora-metrics
  annotations:
    # IRSA role for AWS Secrets Manager + (optionally) RDS IAM auth.
    # Replace ${AWS_ACCOUNT_ID} and adjust role name to match Terraform output.
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/dora-backend-irsa
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dora-frontend
  namespace: dora-metrics
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres
  namespace: dora-metrics
automountServiceAccountToken: false
