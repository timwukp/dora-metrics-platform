receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  # Forward to backend webhook for storage
  otlphttp:
    endpoint: http://backend:8000/api/v1/webhooks/otel

  # Prometheus for Grafana dashboards
  prometheus:
    endpoint: 0.0.0.0:8888
    namespace: dora
    resource_to_telemetry_conversion:
      enabled: true

  # Debug logging
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp, debug]
